[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nano-vllm-lab"
version = "0.3"
authors = [{ name = "Xingkai Yu & Jiawei Shi" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "A hands-on fork of nano-vllm — TP/DP, Qwen3.5, etc."
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "triton>=3.0.0",
    "transformers>=4.51.0",
    "flash-attn",
    "xxhash",
]

[project.urls]
Homepage="https://github.com/SJW21/Nano-vLLM-Lab"

[tool.setuptools.packages.find]
where = ["."]
include = ["nanovllm*"]
